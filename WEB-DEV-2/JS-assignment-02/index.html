<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Async Weather Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #161E54, #2a3570);
            padding: 20px;
            transition: 0.3s;
        }

        .dark {
            background: #000;
        }

        .container {
            max-width: 1300px;
            margin: auto;
        }

        .parent-card {
            display: flex;
            gap: 20px;
        }

        h1 {
            text-align: center;
            color: #BBE0EF;
            margin-bottom: 20px;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            width: 100%;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            border: 2px solid #BBE0EF;
        }

        button {
            padding: 10px 20px;
            background: #F16D34;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .weather-item {
            display: flex;
            justify-content: space-between;
            padding: 8px;
            border-left: 4px solid #F16D34;
            margin-bottom: 6px;
            background: #f9f9f9;
        }

        .history button {
            margin: 5px;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .loader {
            text-align: center;
            font-weight: bold;
        }

        @media (max-width:700px) {
            .parent-card {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌤 Async Weather Tracker</h1>

        <div style="text-align:center; margin-bottom:10px;">
            <button onclick="toggleTheme()">🌙 Toggle Mode</button>
        </div>

        <div class="parent-card">

            <div class="card">
                <h3>Search City</h3>

                <div class="input-group">
                    <input id="cityInput" placeholder="Delhi, London">
                    <button id="searchBtn">Search</button>
                </div>

                <br><br>

                <h3>Search History</h3>
                <div class="history" id="history"></div>
            </div>

            <div class="card">
                <h3>Weather Info</h3>
                <div id="weather"></div>
            </div>

        </div>
    </div>

    <script>
        const API_KEY = "590a9b743d8e967b3e729128f26b1621";

        const weatherBox = document.getElementById("weather");
        const historyBox = document.getElementById("history");
        const cityInput = document.getElementById("cityInput");

        /* ---------- THEME ---------- */
        function toggleTheme() {
            document.body.classList.toggle("dark");
        }

        /* ---------- FETCH WEATHER ---------- */
        async function getWeather(city) {
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        // API-level errors
        if (data.cod !== 200) {
            throw new Error(data.message);
        }

        return data;

    } catch (err) {
        throw new Error(err.message || "Something went wrong");
    }
}
        

        /* ---------- RENDER ---------- */
        function renderWeather(d) {
            weatherBox.innerHTML = `
                <div class="weather-item"><label>City</label><span>${d.name}, ${d.sys.country}</span></div>
                <div class="weather-item"><label>Temperature</label><span>${d.main.temp} °C</span></div>
                <div class="weather-item"><label>Weather</label><span>${d.weather[0].main}</span></div>
                <div class="weather-item"><label>Humidity</label><span>${d.main.humidity}%</span></div>
                <div class="weather-item"><label>Wind Speed</label><span>${d.wind.speed} m/s</span></div>
            `;
        }

        /* ---------- SEARCH ---------- */
        async function search(city) {
            weatherBox.innerHTML = `<p class="loader">Loading...</p>`;

            try {
                const data = await getWeather(city);
                renderWeather(data);
                saveHistory(data.name);
            } catch (err) {
                weatherBox.innerHTML = `<p style="color:red">${err.message}</p>`;
            }
        }

        /* ---------- HISTORY ---------- */
        function saveHistory(city) {
            let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

            if (!history.includes(city)) {
                history.unshift(city);
            }

            history = history.slice(0, 6);

            localStorage.setItem("weatherHistory", JSON.stringify(history));

            showHistory();
        }

        function showHistory() {
            let history = JSON.parse(localStorage.getItem("weatherHistory")) || [];

            historyBox.innerHTML = "";

            history.forEach(city => {
                const btn = document.createElement("button");
                btn.textContent = city;

                btn.onclick = () => search(city);

                historyBox.appendChild(btn);
            });
        }

        /* ---------- EVENTS ---------- */
        document.getElementById("searchBtn").onclick = () => {
            const city = cityInput.value.trim();
            if (city) search(city);
        };

        cityInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                const city = cityInput.value.trim();
                if (city) search(city);
            }
        });

        /* ---------- LOAD ---------- */
        showHistory();
    </script>

</body>

</html>
